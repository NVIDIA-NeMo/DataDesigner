name: "Agentic CI: Repository Triage"

on:
  schedule:
    - cron: "0 10 * * 1"  # every Monday at 10:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: agentic-ci-issue-triage
  cancel-in-progress: true

jobs:
  triage:
    if: github.repository_owner == 'NVIDIA-NeMo'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      checks: read
      contents: read
      issues: read
      pull-requests: read
      statuses: read
    env:
      CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"
      DISABLE_AUTOUPDATER: "1"
    steps:
      - name: Check required config
        env:
          AGENTIC_CI_MODEL: ${{ secrets.AGENTIC_CI_MODEL }}
          TRACKING_ISSUE: ${{ vars.ISSUE_TRIAGE_TRACKING_ISSUE }}
          ANTHROPIC_BASE_URL: ${{ secrets.AGENTIC_CI_API_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.AGENTIC_CI_API_KEY }}
        run: |
          if [ -z "$AGENTIC_CI_MODEL" ] || [ -z "$ANTHROPIC_BASE_URL" ] || [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Inference configuration is required."
            exit 1
          fi
          if [[ ! "$TRACKING_ISSUE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::A valid tracking issue number is required."
            exit 1
          fi

      - name: Install Claude Code
        run: |
          npm install --global --prefix "$RUNNER_TEMP/claude-code" @anthropic-ai/claude-code@2.1.287
          echo "$RUNNER_TEMP/claude-code/bin" >> "$GITHUB_PATH"

      - name: Checkout workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect public repository data
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          gh issue list --state open --limit 200 \
            --json number,title,updatedAt,labels,assignees,author,body |
            jq -c 'map(.body = ((.body // "")[:1200]))' > "$RUNNER_TEMP/open-issues.json"
          gh pr list --state open --limit 200 \
            --json number,title,updatedAt,labels,author,headRefName,body,closingIssuesReferences,statusCheckRollup |
            jq -c 'map(
              .body = ((.body // "")[:1200])
              | .failedChecks = ([.statusCheckRollup[]? | .conclusion // .state | select(. == "FAILURE" or . == "ERROR")] | length)
              | del(.statusCheckRollup)
            )' > "$RUNNER_TEMP/open-prs.json"
          gh pr list --state merged --limit 100 \
            --json number,title,headRefName,body,mergedAt,closingIssuesReferences |
            jq -c 'map(.body = ((.body // "")[:800]))' > "$RUNNER_TEMP/merged-prs.json"

      - name: Generate triage report
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.AGENTIC_CI_API_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.AGENTIC_CI_API_KEY }}
          AGENTIC_CI_MODEL: ${{ secrets.AGENTIC_CI_MODEL }}
          DISABLE_PROMPT_CACHING: "1"
        run: |
          set -o pipefail
          {
            printf 'Date (UTC): %s\nOpen issues:\n' "$(date -u +%F)"
            cat "$RUNNER_TEMP/open-issues.json"
            printf '\nOpen PRs:\n'
            cat "$RUNNER_TEMP/open-prs.json"
            printf '\nRecently merged PRs:\n'
            cat "$RUNNER_TEMP/merged-prs.json"
          } | claude --bare --tools "" --disallowedTools "mcp__*" \
            --model "$AGENTIC_CI_MODEL" --effort high --max-turns 1 \
            --system-prompt-file .agents/recipes/issue-triage/recipe.md \
            -p "Produce the repository triage report from the supplied JSON." \
            > "$RUNNER_TEMP/triage-report.md" 2>/dev/null || {
              echo "::error::Triage recipe failed (Claude exit $?)."
              exit 1
            }
          /usr/bin/python3 scripts/redact_agentic_ci_output.py "$RUNNER_TEMP/triage-report.md"
          test -s "$RUNNER_TEMP/triage-report.md"
          cat "$RUNNER_TEMP/triage-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload triage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-triage-report
          path: ${{ runner.temp }}/triage-report.md
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  publish:
    needs: triage
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download triage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repository-triage-report
          path: ${{ runner.temp }}/triage-report

      - name: Publish triage report
        env:
          GH_TOKEN: ${{ github.token }}
          TRACKING_ISSUE: ${{ vars.ISSUE_TRIAGE_TRACKING_ISSUE }}
        run: |
          /usr/bin/python3 scripts/publish_agentic_ci_triage.py \
            --repo "$GITHUB_REPOSITORY" --issue "$TRACKING_ISSUE" \
            "$RUNNER_TEMP/triage-report/triage-report.md"
