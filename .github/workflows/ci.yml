name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: "Optional head SHA that this dispatched run must execute"
        required: false
        type: string

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-dispatch:
    name: Validate dispatched SHA
    runs-on: ubuntu-latest
    steps:
      - name: Check expected SHA
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          if [ -n "$EXPECTED_HEAD_SHA" ] && [ "$GITHUB_SHA" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::Workflow SHA ${GITHUB_SHA} does not match expected ${EXPECTED_HEAD_SHA}."
            exit 1
          fi
          echo "Dispatch target SHA validated."

  # ===========================================================================
  # Independent Package Tests
  # Each package is tested in isolation to ensure proper dependency boundaries
  # ===========================================================================

  test-config:
    name: Test Config (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    needs: validate-dispatch
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install data-designer-config only
        run: uv sync --package data-designer-config

      - name: Install test dependencies
        run: uv pip install --python .venv/bin/python pytest pytest-asyncio pytest-env pytest-cov

      - name: Run config tests
        env:
          COVERAGE_FILE: .coverage.config
          PYTEST_ADDOPTS: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' && '--cov=data_designer --cov-report= --cov-fail-under=0' || '' }}
        run: .venv/bin/pytest packages/data-designer-config/tests

      - name: Upload config coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-config
          path: .coverage.config
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  test-engine:
    name: Test Engine (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    needs: validate-dispatch
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install data-designer-engine only
        run: uv sync --package data-designer-engine

      - name: Install test dependencies
        run: uv pip install --python .venv/bin/python pytest pytest-asyncio pytest-httpx pytest-env pytest-cov

      - name: Run engine tests
        env:
          COVERAGE_FILE: .coverage.engine
          PYTEST_ADDOPTS: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' && '--cov=data_designer --cov-report= --cov-fail-under=0' || '' }}
        run: .venv/bin/pytest packages/data-designer-engine/tests

      - name: Upload engine coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-engine
          path: .coverage.engine
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  test-interface:
    name: Test Interface (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    needs: validate-dispatch
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # Needed for the build to work
      - name: Copy README to data-designer package
        run: cp README.md packages/data-designer/README.md

      - name: Install data-designer (full package)
        run: uv sync --package data-designer

      - name: Ensure jq for workflow tests
        run: |
          if ! command -v jq >/dev/null; then
            if [ "$RUNNER_OS" = "macOS" ]; then
              brew install jq
            else
              sudo apt-get update && sudo apt-get install -y jq
            fi
          fi
          jq --version

      - name: Install test dependencies
        run: uv pip install --python .venv/bin/python pytest pytest-asyncio pytest-httpx pytest-env pytest-cov

      - name: Run interface tests
        env:
          COVERAGE_FILE: .coverage.interface
          PYTEST_ADDOPTS: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' && '--cov=data_designer --cov-report= --cov-fail-under=0' || '' }}
        run: .venv/bin/pytest packages/data-designer/tests

      - name: Upload interface coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-interface
          path: .coverage.interface
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # ===========================================================================
  # End-to-End Tests
  # ===========================================================================

  test-e2e:
    name: End to end test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    needs: validate-dispatch
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
          enable-cache: false

      - name: Run e2e tests
        run: make test-e2e

  # ===========================================================================
  # Code Quality
  # ===========================================================================

  lint:
    name: Lint and Format Check
    needs: validate-dispatch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest"
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: make install-dev

      - name: Check formatting
        run: make format-check

      - name: Run linter
        run: make lint

      - name: Test Graphify compatibility
        run: make test-graphify

  license-headers:
    name: Check License Headers
    needs: validate-dispatch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full history needed for file creation dates

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest"
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: make install-dev

      - name: Check license headers
        run: make check-license-headers

  dependency-licenses:
    name: Check Dependency Licenses (Python ${{ matrix.python-version }})
    needs: validate-dispatch
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Check dependency licenses
        run: make check-dependency-licenses LICENSE_PYTHON_VERSION=${{ matrix.python-version }}

  test-summary:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [validate-dispatch, test-config, test-engine, test-interface, test-e2e, lint, license-headers, dependency-licenses]
    if: always()
    steps:
      - name: Check all jobs passed
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$CHECK_RESULTS"
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          python-version: "3.11"
          enable-cache: true
      - name: Install all packages
        run: make install-dev
      - name: Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Check combined coverage
        run: .venv/bin/python scripts/report_ci_coverage.py
