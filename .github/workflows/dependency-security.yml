name: Dependency Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  constraints:
    name: Check security constraints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          python-version: "3.11"
      - run: make check-security-constraints

  audit:
    name: Audit ${{ matrix.project }} dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [".", "tests_e2e"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          python-version: "3.11"
      # Includes all dependency groups and extras, across supported Python versions.
      # --locked prevents the scan from silently re-resolving vulnerable pins.
      - run: uv audit --project "${{ matrix.project }}" --locked
