name: 'Agentic CI: Review guidance'
'on':
  pull_request_target:
    types:
    - opened
    - ready_for_review
    - labeled
    branches:
    - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to receive /review guidance
        required: true
permissions:
  pull-requests: write
concurrency:
  group: agentic-ci-pr-review-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
    - name: Check permissions
      id: check
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_ACTION: ${{ github.event.action }}
        LABEL_NAME: ${{ github.event.label.name }}
        IS_DRAFT: ${{ github.event.pull_request.draft }}
        SENDER_LOGIN: ${{ github.event.sender.login }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        REPO: ${{ github.repository }}
      run: |
        # workflow_dispatch callers already have write access.
        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          echo "allowed=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Only the agent-review label should trigger a run.
        if [ "$EVENT_ACTION" = "labeled" ] && [ "$LABEL_NAME" != "agent-review" ]; then
          echo "Skipping: labeled event but not agent-review"
          echo "allowed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Skip drafts unless agent-review label is being added.
        if [ "$IS_DRAFT" = "true" ]; then
          if [ "$EVENT_ACTION" != "labeled" ] || [ "$LABEL_NAME" != "agent-review" ]; then
            echo "Skipping: draft PR"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        fi

        # For labeled events, check the sender (who added the label) so
        # maintainers can authorize reviews on external PRs.
        # For other events, check the PR author.
        if [ "$EVENT_ACTION" = "labeled" ]; then
          USER="$SENDER_LOGIN"
          echo "Checking sender (labeler): ${USER}"
        else
          USER="$PR_AUTHOR"
          echo "Checking PR author: ${USER}"
        fi

        PERMISSION=$(gh api "repos/${REPO}/collaborators/${USER}/permission" --jq '.permission')
        echo "permission=${PERMISSION}"

        if [ "$PERMISSION" = "admin" ] || [ "$PERMISSION" = "write" ]; then
          echo "allowed=true" >> "$GITHUB_OUTPUT"
        else
          echo "Skipping: ${USER} does not have write access (permission=${PERMISSION})"
          echo "allowed=false" >> "$GITHUB_OUTPUT"
        fi
    timeout-minutes: 5
  review-guidance:
    name: Post /review guidance
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
    steps:
    - name: Explain the replacement command
      env:
        NOTICE: Automatic Agentic CI reviews have been retired. Request a review by commenting `/review` on this pull request. Use `/review mode=strict` for a deeper review, or `/review model=claude` to select Claude. Comment `/review help` for all options.
      run: gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file - <<< "$NOTICE"
