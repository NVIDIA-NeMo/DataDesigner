version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      all-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
  - package-ecosystem: pip
    directory: /.agents
    schedule:
      interval: weekly
    # Hold routine upgrades for the 0.4 adapter; keep security updates enabled.
    ignore:
      - dependency-name: graphifyy
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      graphify:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
  - package-ecosystem: pip
    directory: /packages/data-designer-config
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore"
  - package-ecosystem: pip
    directory: /packages/data-designer-engine
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore"
  - package-ecosystem: pip
    directory: /packages/data-designer
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore"
