<title id="title">Path 1: Direct LLM Translation</title>
<desc id="desc">An English document is translated in one call by an LLM, then scored by an LLM judge. If the score is at least 75, the translation becomes the translated document. If not, and the rewrite budget (rewrites less than max_rewrites) is not yet exhausted, the document is rewritten and sent back to the same LLM judge for re-evaluation. Once the score reaches 75 or the rewrite budget is exhausted, whichever comes first, the result becomes the translated document.</desc>
