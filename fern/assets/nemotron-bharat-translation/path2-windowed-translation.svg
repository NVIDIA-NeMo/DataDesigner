<title id="title">Path 2: Overlapping Windowed Translation and Restitching</title>
<desc id="desc">Used for Santali. The full English document is split into 4 overlapping windows, shown stacked one below another with their horizontal span staggered to indicate the overlap between consecutive windows. All 4 windows pass through a single specialist translator block, then through a single general-purpose LLM block that removes each window's overlap, producing 4 aligned, non-overlapping segments. These segments are stacked back together into the final Santali document.</desc>
