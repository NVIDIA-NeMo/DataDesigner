<title id="title">Path 3: LLM Translation to a Different Script, Then Remapping</title>
<desc id="desc">Used for Manipuri. An English document is translated by a specialist translator into Bengali-script Manipuri, a script it handles well, then a deterministic character-level remap converts Bengali script to Meitei Mayek, producing the final Manipuri document.</desc>
