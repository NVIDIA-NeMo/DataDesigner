<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="610" viewBox="0 0 1400 610" role="img" aria-label="The allocation ends. Saved progress stays."><title>The allocation ends. Saved progress stays.</title><desc>Recovery schematic, not to scale. A new allocation restarts serving.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#426e14"/></marker><pattern id="unfinished" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#fff4da"/><path d="M0 0V10" stroke="#b58b39" stroke-width="3"/></pattern></defs><rect width="1400" height="610" rx="22" fill="#fffdf5"/><text x="48" y="48" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="650" letter-spacing="2" fill="#426e14">DATA DESIGNER / EXECUTION NOTES</text><text x="48" y="93" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="650" letter-spacing="0" fill="#20351f">The allocation ends. Saved progress stays.</text><text x="48" y="124" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" letter-spacing="0" fill="#586b55">Recovery schematic, not to scale. A new allocation restarts serving.</text><text x="48" y="191" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="650" letter-spacing="1.8" fill="#586b55">ATTEMPT 1</text><rect x="48" y="211" width="150" height="68" rx="12" fill="#e9e9dd" stroke="#cfdbc5"/><text x="63" y="252" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" letter-spacing="0" fill="#20351f">Startup</text><rect x="210" y="211" width="218" height="68" rx="12" fill="#dcebc7" stroke="#cfdbc5"/><text x="225" y="252" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" letter-spacing="0" fill="#20351f">Saved row groups</text><rect x="440" y="211" width="218" height="68" rx="12" fill="#dcebc7" stroke="#cfdbc5"/><text x="455" y="252" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" letter-spacing="0" fill="#20351f">Saved row groups</text><rect x="670" y="211" width="218" height="68" rx="12" fill="#dcebc7" stroke="#cfdbc5"/><text x="685" y="252" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" letter-spacing="0" fill="#20351f">Saved row groups</text><rect x="900" y="211" width="265" height="68" rx="12" fill="url(#unfinished)" stroke="#cfdbc5"/><text x="915" y="252" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" letter-spacing="0" fill="#20351f">Unfinished work</text><path d="M1187 180V304" stroke="#936114" stroke-width="2" stroke-dasharray="6 5"/><text x="1198" y="226" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="650" letter-spacing="0" fill="#936114">Allocation</text><text x="1198" y="252" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="650" letter-spacing="0" fill="#936114">boundary</text><text x="210" y="308" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#426e14">Durable generation progress</text><path d="M560 325V374H326V408" fill="none" stroke="#426e14" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 6"/><text x="48" y="393" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="650" letter-spacing="1.8" fill="#586b55">RETRY</text><rect x="48" y="421" width="150" height="68" rx="12" fill="#e9e9dd" stroke="#cfdbc5"/><text x="65" y="462" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#20351f">Startup again</text><rect x="210" y="421" width="460" height="68" rx="12" fill="#e5f0d7" stroke="#8cae62"/><text x="230" y="448" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="650" letter-spacing="0" fill="#426e14">Reuse compatible saved progress</text><text x="230" y="474" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" letter-spacing="0" fill="#586b55">Not a replay of finished model calls</text><rect x="682" y="421" width="480" height="68" rx="12" fill="#dcebc7" stroke="#cfdbc5"/><text x="703" y="448" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" letter-spacing="0" fill="#20351f">Regenerate unfinished work and continue</text><text x="703" y="474" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" letter-spacing="0" fill="#586b55">In-flight requests and server state are not restored</text><text x="48" y="557" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" letter-spacing="0" fill="#586b55">Retry is explicitly submitted. Resume depends on persisted compatibility evidence and available artifacts.</text></svg>
