# =============================================================================
# WORKSPACE CONFIGURATION (not a publishable package)
# =============================================================================
# This pyproject.toml defines the uv workspace for the DataDesigner monorepo.
# It is NOT a package itself—see `package = false` below. The [project] section
# exists only to satisfy pyproject.toml structural requirements.
#
# Subpackages are located in packages/ and each has its own pyproject.toml.
# See WORKSPACE.md for full documentation on the namespace package structure.
# =============================================================================

[project]
name = "data-designer-workspace"
version = "0.0.0"  # Placeholder, never used since package = false
description = "DataDesigner monorepo workspace"
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Workspace members - each package contributes to the `data_designer` namespace
[tool.uv.workspace]
members = [
    "packages/data-designer-config",
    "packages/data-designer-engine",
    "packages/data-designer",
]

[tool.uv]
# IMPORTANT: This root is NOT a package. It only defines workspace configuration.
package = false
required-version = ">=0.13.4"
# Minimum versions for transitive dependencies with known security vulnerabilities.
constraint-dependencies = [
    "anyio>=4.14.2",
    "bleach>=6.4.0",
    "cryptography>=50.0.0",
    "filelock>=4.2.1",
    "idna>=3.15",
    "pydantic-settings>=2.14.2",
    "PyJWT>=2.15.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
    "urllib3>=2.8.0",
    "virtualenv>=21.14.13",
]

[dependency-groups]
dev = [
    "jsonpath-ng>=1.5.3,<2",
    "pre-commit>=4.0.0,<5",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-cov>=7.0.0,<8",
    "pytest-env>=1.2.0,<2",
    "pytest-httpx>=0.36.0,<1",
    "ruff>=0.14.10,<1",
]
docs = [
    "jupytext>=1.16.0,<2",
]
notebooks = [
    "aiohttp>=3.14.4,<4", # Keep aligned with the security constraint above
    "datasets>=5.0.1,<6", # 5.0.1 fixes CVE-2026-66007
    "ipykernel>=6.29.0,<7",
    "jupyter>=1.0.0,<2",
    "jupyter-server>=2.21.0,<3", # Keep aligned with the security constraint above
    "jupyterlab>=4.6.4,<5", # 4.6.4 fixes CVE-2026-102831
    "mistune>=3.3.3,<4", # 3.3.3 fixes security advisory pulled in by nbconvert
    "nbconvert>=7.17.2,<8", # 7.17.2 fixes export filename path traversal
    "notebook>=7.6.3,<8", # 7.6.3 fixes CVE-2026-102831
    "setuptools>=84.1.0,<85", # 84.1.0 fixes the namespace_packages.txt path escape
    "soupsieve>=2.9.1,<3", # 2.9.1 fixes soupsieve security advisories pulled in by nbconvert
    "tornado>=6.5.10,<7", # 6.5.9 fixes advisories; 6.5.10 restores Jupyter compatibility
]
recipes = [
    "bm25s>=0.2.0,<1",
    "pymupdf>=1.24.0,<2",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "session"
env = ["DISABLE_DATA_DESIGNER_PLUGINS=true"]

[tool.coverage.run]
omit = ["**/engine/models/telemetry.py"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = [
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort (import sorting)
    "ICN",   # flake8-import-conventions
    "PIE",   # flake8-pie (misc lints)
    "TID",   # flake8-tidy-imports (ban relative imports)
    "UP006", # List[A] -> list[A]
    "UP007", # Union[A, B] -> A | B
    "UP017", # datetime.timezone.utc -> datetime.UTC
    "UP035", # Deprecated typing aliases -> standard-library imports
    "UP041", # asyncio.TimeoutError -> TimeoutError
    "UP045", # Optional[A] -> A | None
]
ignore = [
    "ANN401", # Dynamically typed expressions (Any)
]

[tool.ruff.lint.isort]
known-first-party = ["data_designer", "data_designer_e2e_tests"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
