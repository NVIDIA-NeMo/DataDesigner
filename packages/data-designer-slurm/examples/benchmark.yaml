schema_version: 1
name: generator-scaling
base_run: benchmark-run.yaml
model_aliases: all
concurrency_values:
  - 32
  - 64
deployment_cases:
  - name: single-node-groups
    deployments:
      generator:
        nodes: 2
        nodes_per_replica: 1
  - name: two-node-group
    deployments:
      generator:
        nodes: 2
        nodes_per_replica: 2
analysis:
  target_total_records: 1000000
  target_runtime: 4h
