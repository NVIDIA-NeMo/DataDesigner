schema_version: 1
name: local-generation-hosted-review
builder:
  inline:
    data_designer:
      model_configs:
        - alias: generator
          model: example/generator
          provider: openai
        - alias: judge
          model: example/hosted-judge
          provider: hosted
      columns:
        - name: description
          column_type: llm-text
          model_alias: generator
          prompt: Write a short description of an everyday household product.
        - name: review
          column_type: llm-text
          model_alias: judge
          prompt: "Review this product description for clarity: {{ description }}"
invocation:
  num_records: 100
  dataset_name: judged-descriptions
  model_concurrency:
    generator: 32
    judge: 16
deployments:
  - model_alias: generator
    model: example/generator
    server:
      type: vllm
      image:
        name: vllm
    topology:
      tensor_parallel: 8
